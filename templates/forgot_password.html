{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 mt-5">
            <h3 class="text-center mb-4">Reset Password</h3>

            {% if step == 1 %}
            <!-- Stage 1: Ask for Username -->
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="mb-3">
                    <label>Enter your Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Find Account</button>
            </form>
            {% elif step == 2 %}
            <!-- Stage 2: Ask the Security Question -->
            <form method="POST" action="{{ url_for('reset_password') }}">
                <input type="hidden" name="username" value="{{ username }}">
                <div class="mb-3">
                    <label class="text-muted small">Security Question:</label>
                    <p class="fw-bold text-primary">{{ question }}</p>
                </div>
                <div class="mb-3">
                    <label>Your Answer</label>
                    <input type="text" name="sec_answer" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label>New Password</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Reset Password</button>
            </form>
            {% endif %}
            
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-decoration-none text-muted small">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
